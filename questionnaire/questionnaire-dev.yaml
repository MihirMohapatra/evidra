server:
  host: "0.0.0.0"
  port: 8082
  read_timeout: 30s
  write_timeout: 30s
  shutdown_timeout: 30s

database:
  url: "postgres://evidra:evidra@localhost:5432/evidra_questionnaire?sslmode=disable"
  max_open_conns: 25
  max_idle_conns: 5
  conn_max_lifetime: 5m

storage:
  bucket: "questionnaires"
  endpoint: "localhost:9000"
  access_key: "minioadmin"
  secret_key: "minioadmin"
  use_ssl: false
  region: "us-east-1"
  max_file_size: 52428800

nats:
  url: "nats://localhost:4222"

app:
  worker_concurrency: 5
