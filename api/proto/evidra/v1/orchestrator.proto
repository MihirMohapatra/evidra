syntax = "proto3";
package evidra.v1;

option go_package = "github.com/evidra/evidra/api/gen/evidra/v1;evidrav1";

import "google/protobuf/timestamp.proto";
import "evidra/v1/common.proto";

message AnswerRequest {
  string tenant_id = 1;
  string question = 2;
  string question_id = 3;
}

message AnswerResponse {
  string draft_id = 1;
  string answer = 2;
  double confidence = 3;
  string model_used = 4;
  repeated string evidence_ids = 5;
  string reasoning = 6;
}

message SearchRequest {
  string tenant_id = 1;
  string query = 2;
  int32 limit = 3;
}

message SearchResult {
  string id = 1;
  string title = 2;
  string content = 3;
  string category = 4;
  double score = 5;
  string source_url = 6;
}

message SearchResponse {
  repeated SearchResult results = 1;
}

message Draft {
  string id = 1;
  string question_id = 2;
  string question_text = 3;
  string answer = 4;
  double confidence = 5;
  string model_used = 6;
  repeated string evidence_ids = 7;
  string reasoning = 8;
  string status = 9;
  string feedback = 10;
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp updated_at = 12;
}

message GetDraftRequest {
  string id = 1;
}

message ListDraftsRequest {
  int32 page = 1;
  int32 page_size = 2;
}

message ListDraftsResponse {
  repeated Draft drafts = 1;
  int32 total = 2;
}

message ReviewDraftRequest {
  string id = 1;
  string status = 2;
  string feedback = 3;
}

service OrchestratorService {
  rpc Answer(AnswerRequest) returns (AnswerResponse);
  rpc GetDraft(GetDraftRequest) returns (Draft);
  rpc ListDrafts(ListDraftsRequest) returns (ListDraftsResponse);
}
