openapi: 3.0.3
info:
  title: Evidra Identity Service
  description: Organizations, users, roles, JWT auth, API keys, OIDC/OAuth2
  version: 1.0.0
  contact:
    name: Evidra Team

servers:
  - url: http://localhost:8081/api/v1
    description: Local development

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key

  schemas:
    Organization:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    OrganizationInput:
      type: object
      required: [name, slug]
      properties:
        name: { type: string }
        slug: { type: string }
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        organization_id: { type: string, format: uuid }
        email: { type: string, format: email }
        role: { type: string, enum: [admin, reviewer] }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    UserInput:
      type: object
      required: [email, password, role]
      properties:
        organization_id: { type: string, format: uuid }
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
        role: { type: string, enum: [admin, reviewer] }
    Session:
      type: object
      properties:
        token: { type: string }
        refresh_token: { type: string }
        expires_at: { type: string, format: date-time }
        user: { $ref: '#/components/schemas/User' }
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string }
        password: { type: string }
    RefreshInput:
      type: object
      required: [refresh_token]
      properties:
        refresh_token: { type: string }
    APIKey:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        key_prefix: { type: string }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    APIKeyFull:
      allOf:
        - $ref: '#/components/schemas/APIKey'
        - type: object
          properties:
            raw_key: { type: string }
    APIKeyInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
    OIDCProvider:
      type: object
      properties:
        name: { type: string }
        redirect_url: { type: string }
    Error:
      type: object
      properties:
        error: { type: string }
        code: { type: string }

paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: Authenticate user
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginInput' }
      responses:
        '200':
          description: Session created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh session token
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshInput' }
      responses:
        '200':
          description: New session
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Invalidate session
      security:
        - BearerAuth: []
      responses:
        '204': { description: Logged out }

  /auth/oidc/providers:
    get:
      tags: [OIDC]
      summary: List OIDC providers
      responses:
        '200':
          description: Available providers
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/OIDCProvider' }

  /auth/oidc/{provider}/login:
    get:
      tags: [OIDC]
      summary: Initiate OIDC login
      parameters:
        - name: provider
          in: path
          required: true
          schema: { type: string }
      responses:
        '302':
          description: Redirect to provider

  /auth/oidc/{provider}/callback:
    get:
      tags: [OIDC]
      summary: Handle OIDC callback
      parameters:
        - name: provider
          in: path
          required: true
          schema: { type: string }
        - name: code
          in: query
          required: true
          schema: { type: string }
        - name: state
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Session created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }

  /organizations:
    get:
      tags: [Organizations]
      summary: List organizations
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      responses:
        '200':
          description: Organization list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Organization' }
    post:
      tags: [Organizations]
      summary: Create organization
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrganizationInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Organization' }

  /organizations/{id}:
    get:
      tags: [Organizations]
      summary: Get organization
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Organization
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Organization' }
    put:
      tags: [Organizations]
      summary: Update organization
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrganizationInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Organization' }
    delete:
      tags: [Organizations]
      summary: Delete organization
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Deleted }

  /users:
    get:
      tags: [Users]
      summary: List users
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: organization_id
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: User list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/User' }
    post:
      tags: [Users]
      summary: Create user
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }

  /users/{id}:
    get:
      tags: [Users]
      summary: Get user
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: User
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
    put:
      tags: [Users]
      summary: Update user
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string }
                role: { type: string, enum: [admin, reviewer] }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
    delete:
      tags: [Users]
      summary: Delete user
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Deleted }

  /api-keys:
    get:
      tags: [API Keys]
      summary: List API keys
      security:
        - BearerAuth: []
      parameters:
        - name: organization_id
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: API key list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/APIKey' }
    post:
      tags: [API Keys]
      summary: Create API key
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/APIKeyInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/APIKeyFull' }

  /api-keys/{id}:
    delete:
      tags: [API Keys]
      summary: Revoke API key
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Revoked }
