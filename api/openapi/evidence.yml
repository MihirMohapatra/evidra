openapi: 3.0.3
info:
  title: Evidra Evidence Service
  description: Evidence repository with approval state machine and 5 categories
  version: 1.0.0

servers:
  - url: http://localhost:8083/api/v1/evidence
    description: Local development

components:
  schemas:
    EvidenceItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        owner_id: { type: string, format: uuid }
        title: { type: string }
        content: { type: string }
        source_url: { type: string }
        category:
          type: string
          enum: [policy, answer, claim, certification, architecture]
        status:
          type: string
          enum: [DRAFT, NEEDS_REVIEW, APPROVED, EXPORTED]
        tags:
          type: array
          items: { type: string }
        version: { type: integer }
        expires_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CreateEvidenceInput:
      type: object
      required: [title, content, category]
      properties:
        title: { type: string }
        content: { type: string }
        category:
          type: string
          enum: [policy, answer, claim, certification, architecture]
        owner_id: { type: string, format: uuid }
        source_url: { type: string }
        tags:
          type: array
          items: { type: string }
    Approval:
      type: object
      properties:
        id: { type: string, format: uuid }
        evidence_id: { type: string, format: uuid }
        reviewer_id: { type: string, format: uuid }
        status: { type: string }
        comment: { type: string }
        created_at: { type: string, format: date-time }
    PaginatedResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/EvidenceItem' }
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }
    Error:
      type: object
      properties:
        error: { type: string }
        code: { type: string }

paths:
  /:
    post:
      tags: [Evidence]
      summary: Create evidence
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateEvidenceInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EvidenceItem' }
    get:
      tags: [Evidence]
      summary: List evidence
      parameters:
        - name: tenant_id
          in: query
          schema: { type: string, format: uuid }
        - name: category
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string }
        - name: owner_id
          in: query
          schema: { type: string, format: uuid }
        - name: search
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        '200':
          description: Paginated evidence list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginatedResponse' }

  /{id}:
    get:
      tags: [Evidence]
      summary: Get evidence
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Evidence item
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EvidenceItem' }
    put:
      tags: [Evidence]
      summary: Update evidence
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateEvidenceInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EvidenceItem' }
    delete:
      tags: [Evidence]
      summary: Delete evidence
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Deleted }

  /{id}/submit:
    post:
      tags: [Workflow]
      summary: Submit evidence for review
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Status updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EvidenceItem' }

  /{id}/approve:
    post:
      tags: [Workflow]
      summary: Approve evidence
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                comment: { type: string }
      responses:
        '200':
          description: Approved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EvidenceItem' }

  /{id}/reject:
    post:
      tags: [Workflow]
      summary: Reject evidence
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                comment: { type: string }
      responses:
        '200':
          description: Rejected
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EvidenceItem' }

  /{id}/export:
    post:
      tags: [Workflow]
      summary: Export evidence
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Exported
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EvidenceItem' }

  /{id}/approvals:
    get:
      tags: [Workflow]
      summary: Get approval history
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Approval log
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Approval' }
