server:
  host: "0.0.0.0"
  port: 8084
  read_timeout: 30s
  write_timeout: 60s
  shutdown_timeout: 30s

database:
  url: "postgres://evidra:evidra@localhost:5432/evidra_orchestrator?sslmode=disable"
  max_open_conns: 25
  max_idle_conns: 5
  conn_max_lifetime: 5m

nats:
  url: "nats://localhost:4222"

llm:
  provider: "openai"  # openai | claude | local
  openai_key: ""
  claude_key: ""
  local_url: "http://localhost:11434"
  local_model: "gpt-4o"
  temperature: 0.3
  max_tokens: 2048

embedder:
  provider: "openai"  # openai | local
  openai_key: ""
  local_url: "http://localhost:11434"
  model: "text-embedding-3-small"
