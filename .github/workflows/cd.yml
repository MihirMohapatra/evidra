name: CD

on:
  push:
    branches: [master]
    tags: ['v*']

env:
  REGISTRY: ghcr.io
  IMAGE_TAG: ${{ github.sha }}

jobs:
  deploy-images:
    name: Build & Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}

      - name: Build & push identity
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          target: identity
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/identity:latest
            ${{ env.REGISTRY }}/${{ github.repository }}/identity:${{ env.IMAGE_TAG }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push questionnaire
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          target: questionnaire
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/questionnaire:latest
            ${{ env.REGISTRY }}/${{ github.repository }}/questionnaire:${{ env.IMAGE_TAG }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push questionnaire-worker
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          target: questionnaire-worker
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/questionnaire-worker:latest
            ${{ env.REGISTRY }}/${{ github.repository }}/questionnaire-worker:${{ env.IMAGE_TAG }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push evidence
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          target: evidence
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/evidence:latest
            ${{ env.REGISTRY }}/${{ github.repository }}/evidence:${{ env.IMAGE_TAG }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
