global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "evidra-identity"
    static_configs:
      - targets: ["identity:8081"]
    metrics_path: /metrics

  - job_name: "evidra-questionnaire"
    static_configs:
      - targets: ["questionnaire:8082"]
    metrics_path: /metrics

  - job_name: "evidra-questionnaire-worker"
    static_configs:
      - targets: ["questionnaire-worker:8082"]
    metrics_path: /metrics

  - job_name: "evidra-evidence"
    static_configs:
      - targets: ["evidence:8083"]
    metrics_path: /metrics

  - job_name: "evidra-orchestrator"
    static_configs:
      - targets: ["orchestrator:8084"]
    metrics_path: /metrics

  - job_name: "evidra-orchestrator-worker"
    static_configs:
      - targets: ["orchestrator-worker:8084"]
    metrics_path: /metrics

  - job_name: "evidra-audit"
    static_configs:
      - targets: ["audit:8085"]
    metrics_path: /metrics
