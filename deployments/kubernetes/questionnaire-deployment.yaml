apiVersion: apps/v1
kind: Deployment
metadata:
  name: questionnaire
  namespace: evidra
spec:
  replicas: 2
  selector:
    matchLabels:
      app: questionnaire
  template:
    metadata:
      labels:
        app: questionnaire
    spec:
      terminationGracePeriodSeconds: 30
      containers:
      - name: questionnaire
        image: ghcr.io/OWNER/evidra/questionnaire:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8082
          name: http
        envFrom:
        - configMapRef:
            name: evidra-config
        env:
        - name: EVIDRA_DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: evidra-secret
              key: database-url
        - name: EVIDRA_JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: evidra-secret
              key: jwt-secret
        - name: EVIDRA_LLM_API_KEY
          valueFrom:
            secretKeyRef:
              name: evidra-secret
              key: llm-api-key
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 8082
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /health
            port: 8082
          initialDelaySeconds: 5
          periodSeconds: 10
