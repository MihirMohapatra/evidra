apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity
  namespace: evidra
spec:
  replicas: 2
  selector:
    matchLabels:
      app: identity
  template:
    metadata:
      labels:
        app: identity
    spec:
      terminationGracePeriodSeconds: 30
      containers:
      - name: identity
        image: ghcr.io/OWNER/evidra/identity:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8081
          name: http
        - containerPort: 9081
          name: grpc
        envFrom:
        - configMapRef:
            name: evidra-config
        env:
        - name: EVIDRA_DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: evidra-secret
              key: database-url
        - name: EVIDRA_JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: evidra-secret
              key: jwt-secret
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 8081
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /health
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
