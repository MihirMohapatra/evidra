apiVersion: apps/v1
kind: Deployment
metadata:
  name: evidence
  namespace: evidra
spec:
  replicas: 2
  selector:
    matchLabels:
      app: evidence
  template:
    metadata:
      labels:
        app: evidence
    spec:
      terminationGracePeriodSeconds: 30
      containers:
      - name: evidence
        image: ghcr.io/OWNER/evidra/evidence:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8083
          name: http
        - containerPort: 9083
          name: grpc
        envFrom:
        - configMapRef:
            name: evidra-config
        env:
        - name: EVIDRA_DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: evidra-secret
              key: database-url
        - name: EVIDRA_JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: evidra-secret
              key: jwt-secret
        - name: EVIDRA_STORAGE_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: evidra-secret
              key: storage-access-key
        - name: EVIDRA_STORAGE_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: evidra-secret
              key: storage-secret-key
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 8083
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /health
            port: 8083
          initialDelaySeconds: 5
          periodSeconds: 10
