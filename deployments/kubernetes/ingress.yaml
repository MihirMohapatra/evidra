apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: evidra
  namespace: evidra
spec:
  ingressClassName: nginx
  rules:
  - host: evidra.example.com
    http:
      paths:
      - path: /api/identity
        pathType: Prefix
        backend:
          service:
            name: identity
            port:
              number: 8081
      - path: /api/questionnaire
        pathType: Prefix
        backend:
          service:
            name: questionnaire
            port:
              number: 8082
      - path: /api/evidence
        pathType: Prefix
        backend:
          service:
            name: evidence
            port:
              number: 8083
      - path: /api/orchestrator
        pathType: Prefix
        backend:
          service:
            name: orchestrator
            port:
              number: 8084
      - path: /api/audit
        pathType: Prefix
        backend:
          service:
            name: audit
            port:
              number: 8085
